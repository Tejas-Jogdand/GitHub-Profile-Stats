<svg
  xmlns="http://www.w3.org/2000/svg"
  width="495"
  height="215"
  viewBox="0 0 495 215"
  fill="none"
  role="img"
  aria-label="Most Used Languages"
>
  <style>
    .header {
      font: 600 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      fill: #58a6ff;
      animation: fadeIn 0.6s ease-in-out;
    }
    .stat-label {
      font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      fill: #8b949e;
    }
    .stat-value {
      font: 700 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      fill: #f0f6fc;
    }
    .stat-hero {
      font: 800 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      fill: #f0f6fc;
    }
    .subtext {
      font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      fill: #6e7681;
    }
    .icon {
      color: #58a6ff;
    }
    .icon-fire {
      color: #f85149;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>

  <!-- Background Card -->
  <rect
    x="0.5"
    y="0.5"
    rx="8"
    height="214"
    width="494"
    fill="#0d1117"
    stroke="#30363d"
    stroke-width="1"
  />

  <!-- Header -->
  <g class="header">
    <g transform="translate(25, 23)" fill="#58a6ff"><svg class="icon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
    <path fill-rule="evenodd" d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z"></path>
  </svg></g>
    <text x="48" y="35">Most Used Languages</text>
  </g>

  <!-- Card Body -->
  <g class="body">
    
    <!-- Progress Bar -->
    
    <defs>
      <clipPath id="progress-bar-clip">
        <rect x="25" y="56" width="445" height="10" rx="5" />
      </clipPath>
    </defs>
    <!-- Background track -->
    <rect x="25" y="56" width="445" height="10" rx="5" fill="#21262d" />
    <!-- Segmented progress -->
    <g clip-path="url(#progress-bar-clip)">
      <rect x="25" y="56" width="234.1" height="10" fill="#3178c6" />
      <rect x="259.07000000000005" y="56" width="91.7" height="10" fill="#f1e05a" />
      <rect x="350.74" y="56" width="38.7" height="10" fill="#e34c26" />
      <rect x="389.455" y="56" width="27.1" height="10" fill="#663399" />
      <rect x="416.59999999999997" y="56" width="22.3" height="10" fill="#4F5D95" />
      <rect x="438.84999999999997" y="56" width="31.6" height="10" fill="#8b949e" />
    </g>
  

    <!-- Language Legend -->
    <g class="legend">
      
      <g>
        <circle cx="30" cy="92" r="5" fill="#3178c6" />
        <text class="stat-label" x="43" y="96">TypeScript</text>
        <text class="stat-value" x="227.5" y="96" text-anchor="end">52.6%</text>
      </g>

      <g>
        <circle cx="252.5" cy="92" r="5" fill="#f1e05a" />
        <text class="stat-label" x="265.5" y="96">JavaScript</text>
        <text class="stat-value" x="450" y="96" text-anchor="end">20.6%</text>
      </g>

      <g>
        <circle cx="30" cy="120" r="5" fill="#e34c26" />
        <text class="stat-label" x="43" y="124">HTML</text>
        <text class="stat-value" x="227.5" y="124" text-anchor="end">8.7%</text>
      </g>

      <g>
        <circle cx="252.5" cy="120" r="5" fill="#663399" />
        <text class="stat-label" x="265.5" y="124">CSS</text>
        <text class="stat-value" x="450" y="124" text-anchor="end">6.1%</text>
      </g>

      <g>
        <circle cx="30" cy="148" r="5" fill="#4F5D95" />
        <text class="stat-label" x="43" y="152">PHP</text>
        <text class="stat-value" x="227.5" y="152" text-anchor="end">5.0%</text>
      </g>

      <g>
        <circle cx="252.5" cy="148" r="5" fill="#8b949e" />
        <text class="stat-label" x="265.5" y="152">Other</text>
        <text class="stat-value" x="450" y="152" text-anchor="end">7.1%</text>
      </g>
    </g>
  
  </g>
</svg>