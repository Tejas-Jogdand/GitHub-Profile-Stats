name: Update GitHub Stats Cards

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Generate SVG Cards
        env:
          # Uses repository secret GH_STATS_TOKEN (recommended for private activity) or default GITHUB_TOKEN
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ vars.GITHUB_USERNAME || github.repository_owner }}
          OUTPUT_DIR: ./generated
          FETCH_MULTI_YEAR: ${{ vars.FETCH_MULTI_YEAR || 'true' }}
          CARD_THEME: ${{ vars.CARD_THEME || 'github-dark' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'UTC' }}
        run: npm start

      - name: Commit and push updated SVGs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if any SVG files in the generated/ directory have changed
          if [[ -n $(git status --porcelain generated/) ]]; then
            echo "Changes detected in generated SVG cards. Committing..."
            git add generated/
            git commit -m "chore(stats): update GitHub stats cards [skip ci]"
            git push
          else
            echo "No changes detected. Stats are already up to date."
          fi
